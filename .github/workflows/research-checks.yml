name: Research validation
on:
  push:
    branches: [main, feature/walk-forward-research-audit]
  pull_request:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "scikit-learn>=1.4,<2" "xgboost>=2,<4"
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
